<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle">
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header text-white text-center py-3">
            <h4><i class="bi bi-graph-up-arrow"></i> Student Predict</h4>
            <small class="text-muted">Performance Prediction System</small>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-section="dashboard">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="dataset">
                    <i class="bi bi-database"></i> Dataset
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="preprocessing">
                    <i class="bi bi-gear"></i> Preprocessing
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="training">
                    <i class="bi bi-cpu"></i> Model Training
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="evaluation">
                    <i class="bi bi-bar-chart"></i> Evaluation
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="features">
                    <i class="bi bi-list-ul"></i> Feature Analysis
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="predict">
                    <i class="bi bi-magic"></i> Single Prediction
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="batch">
                    <i class="bi bi-upload"></i> Batch Prediction
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2" id="page-title">Dashboard</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshBtn">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
        </div>
        <div id="content-area"></div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">Message</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
